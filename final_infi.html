<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>final Infinite Scroll Animation</title>
    <style>
      *{
        background-color: #111;
      }
      .container {
        margin-top: 25%;
        width: 100vw;
        height: 200px;
      }
      .track {
        display: flex;
        margin-right: 150px;
        border-radius: 15px;
        width: max-content;
        height: 75%;
        animation: scroller 10s linear infinite reverse none;
      }

      .box {
        display: flex;
        flex: 0 0 auto;
        border-radius: 15px;
        overflow: hidden;
        width: 100px;
        height: 120px;
        align-items: center;
        justify-content: center;
        margin: 25px 10px;
      }

      @keyframes scroller {
        100% {
          transform: translateX(0);
        }
        0% {
          transform: translateX(-100%);
        }
      }

      .container:hover .track {
        animation-play-state: paused;
      }
      
      a img {
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="track">
        <a href="#"><img src="img1.jpg" alt="" class="box" /></a>
        <a href="#"><img src="img2.jpg" alt="" class="box" /></a>
        <a href="#"><img src="img3.png" alt="" class="box" /></a>
        <a href="#"><img src="img4.jpg" alt="" class="box" /></a>
        <a href="#"><img src="img5.jpg" alt="" class="box" /></a>
        <a href="#"><img src="img6.jpg" alt="" class="box" /></a>
        <a href="#"><img src="img7.jpg" alt="" class="box" /></a>
        <a href="#"><img src="img8.jpg" alt="" class="box" /></a>
        <a href="#"><img src="img9.png" alt="" class="box" /></a>
        <!-- repeating this images -->
        <a href="#"><img src="img1.jpg" alt="" class="box" /></a>
        <a href="#"><img src="img2.jpg" alt="" class="box" /></a>
        <a href="#"><img src="img3.png" alt="" class="box" /></a>
        <a href="#"><img src="img4.jpg" alt="" class="box" /></a>
        <a href="#"><img src="img5.jpg" alt="" class="box" /></a>
        <a href="#"><img src="img6.jpg" alt="" class="box" /></a>
        <a href="#"><img src="img7.jpg" alt="" class="box" /></a>
        <a href="#"><img src="img8.jpg" alt="" class="box" /></a>
        <a href="#"><img src="img9.png" alt="" class="box" /></a>

      </div>
    </div>
  </body>
</html>
