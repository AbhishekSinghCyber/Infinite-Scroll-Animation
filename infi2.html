<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>scroll animation 2</title>
    <style>
        .container{
            width:100vw;
            height: 200px;
            background-color: #E9F1FA;
        }
        .track{
            display: flex;
            margin-right: 150px;
            /* background-color: limegreen; */
            border-radius: 15px;
            width: max-content;
            height: 75%;
            animation: scroller 10s linear  infinite;
            
        }
        .a{}
        
        .box{
            display: flex;
            flex: 0 0 auto;
            border-radius: 15px;
            overflow: hidden;
            width: 100px;
            height: 120px;
            background-color: #00ABE4;
            color: white;
            align-items: center;
            justify-content: center;
            margin: 15px 10px;
        }
        @keyframes scroller {
            0% {transform: translateX(0);}
            100% {transform: translateX(100%);}
        }
        .animate{
            animation: scroller 5s linear  infinite reverse;
        }
        
        .container:hover .track{
            animation-play-state: paused;
        }
        a img{
            object-fit: cover;
        }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="track animate">
        <div class="box">item1</div>
        <div class="box">item2</div>
        <div class="box">item3</div>
        <div class="box">item4</div>
        <div class="box">item5</div>
        <!-- repeating element -->
        <div class="box">item1</div>
        <div class="box">item2</div>
        <div class="box">item3</div>
        <div class="box">item4</div>
        <div class="box">item5</div>
      </div>
    </div>
    <div class="container">
      <div class="track">
        <a href="#"><img src="image1.JPG" alt="" class="box"></a>
        <a href="#"><img src="image1.JPG" alt="" class="box"></a>
        <a href="#"><img src="image1.JPG" alt="" class="box"></a>
        <a href="#"><img src="image1.JPG" alt="" class="box"></a>
        <a href="#"><img src="image1.JPG" alt="" class="box"></a>
        <a href="#"><img src="image1.JPG" alt="" class="box"></a>
        <a href="#"><img src="image1.JPG" alt="" class="box"></a>
        <a href="#"><img src="image1.JPG" alt="" class="box"></a>
        <a href="#"><img src="image1.JPG" alt="" class="box"></a>
      </div>
    </div>

    <div class="container">
      <div class="track animate">
        <div class="box">item1</div>
        <div class="box">item2</div>
        <div class="box">item3</div>
        <div class="box">item4</div>
        <div class="box">item5</div>
        <!-- repeating element -->
        <div class="box">item1</div>
        <div class="box">item2</div>
        <div class="box">item3</div>
        <div class="box">item4</div>
        <div class="box">item5</div>
      </div>
    </div>
  </body>
</html>
